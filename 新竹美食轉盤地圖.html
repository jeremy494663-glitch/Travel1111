<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: 左邊是轉盤(朱紅廟柱色),右邊是示意地圖與結果卡;轉到哪家,地圖就亮起那一區 */
:root {
  --bg:#EFF2F1; --surface:#FFFFFF; --ink:#1B282C; --muted:#586A6E; --line:#D6DEDC;
  --accent:#BF3A22; --accent-ink:#FFFFFF; --accent-soft:#F8E4DF; --jade:#2A6A5D; --jade-soft:#DCEDE8;
  --sea:#E1ECF0; --land:#F2EFE5; --wave:#B7CFD9;
  --w0:#B8392B; --w1:#7E2418; --w2:#24465A; --w3:#2B5B3B;
  --w0b:#D2563F; --w1b:#9A3A28; --w2b:#37627C; --w3b:#3F7A52;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#11191B; --surface:#192326; --ink:#E6EDEB; --muted:#9BADAC; --line:#2A3A3D;
  --accent:#F0735A; --accent-ink:#1C0D09; --accent-soft:#3A2420; --jade:#79C7B4; --jade-soft:#1E3631;
  --sea:#142226; --land:#1C2828; --wave:#2B454C; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#11191B; --surface:#192326; --ink:#E6EDEB; --muted:#9BADAC; --line:#2A3A3D;
  --accent:#F0735A; --accent-ink:#1C0D09; --accent-soft:#3A2420; --jade:#79C7B4; --jade-soft:#1E3631;
  --sea:#142226; --land:#1C2828; --wave:#2B454C; color-scheme: dark; }
*,*::before,*::after { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.7;
  padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px)); }
.wrap { max-width:1100px; margin-inline:auto; padding-block:clamp(20px,4vw,44px) 56px; }
a { color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
h1 { font-family:var(--serif); font-weight:900; font-size:clamp(26px,5vw,42px); line-height:1.2; margin:0 0 6px; text-wrap:balance; }
.lead { margin:0 0 18px; color:var(--muted); max-width:38em; }

.chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px; }
.chip { font:inherit; font-size:13px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px; padding:4px 13px; cursor:pointer; }
.chip .n { color:var(--muted); font-variant-numeric:tabular-nums; margin-left:3px; }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.chip[aria-pressed="true"] .n { color:inherit; opacity:.7; }

.stage { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(20px,4vw,48px); align-items:start; }
@media (max-width:820px) { .stage { grid-template-columns:1fr; } }

.wheel-box { position:relative; width:100%; max-width:520px; margin-inline:auto; aspect-ratio:1; }
.wheel-box svg { width:100%; height:100%; display:block; overflow:visible; }
#rot { transform-origin:50% 50%; transform-box:fill-box; will-change:transform; }
.wheel-box svg.ptr { position:absolute; left:50%; top:-3.5%; width:7%; height:auto; transform:translateX(-50%); z-index:2; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.hub { position:absolute; left:50%; top:50%; width:21%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; z-index:2;
  font:inherit; font-family:var(--serif); font-weight:900; font-size:clamp(18px,4.4vw,28px); color:var(--accent-ink); background:var(--accent);
  border:4px solid var(--surface); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.25); }
.hub:disabled { cursor:progress; opacity:.85; }
.sl-t { font-family:var(--sans); font-weight:700; fill:#fff; pointer-events:none; }
.sl-n { font-family:var(--sans); font-weight:700; fill:#fff; pointer-events:none; }
.sl.win { stroke:var(--surface); stroke-width:4; }
.hint { text-align:center; color:var(--muted); font-size:13px; margin:12px 0 0; }

.panel { display:grid; gap:16px; min-width:0; }
.mapbox svg { width:100%; height:auto; display:block; border-radius:10px; border:1px solid var(--line); }
.dz { transition:opacity .3s; }
.dim .dz { opacity:.28; }
.dim .dz.on { opacity:1; }
.ring { fill:none; stroke:var(--accent); stroke-width:1.1; transform-box:fill-box; transform-origin:center; }
@media (prefers-reduced-motion:no-preference) { .dz.on .ring { animation:pulse 1.6s ease-out infinite; } }
@keyframes pulse { 0% { transform:scale(1); opacity:1; } 100% { transform:scale(1.9); opacity:0; } }
.cap { margin:6px 0 0; font-size:12.5px; color:var(--muted); }

.res { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; min-height:170px; }
.res .empty { color:var(--muted); margin:0; padding:22px 0; text-align:center; }
.res-top { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.ico { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--accent-soft); }
.ico svg { width:70%; height:70%; }
.res h2 { font-family:var(--serif); font-weight:900; font-size:clamp(20px,3.4vw,26px); line-height:1.3; margin:0; text-wrap:balance; }
.tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.tag { font-size:11px; line-height:1; padding:4px 7px; border-radius:3px; border:1px solid var(--line); color:var(--muted); }
.tag.bib { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.tag.new { background:var(--jade-soft); color:var(--jade); border-color:var(--jade-soft); }
.res p.d { margin:6px 0 10px; }
.info { margin:0; display:grid; gap:3px; font-size:13px; }
.info div { display:grid; grid-template-columns:2.6em minmax(0,1fr); gap:6px; }
.info dt { color:var(--muted); }
.info dd { margin:0; overflow-wrap:anywhere; }
.acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.btn { font:inherit; font-size:13px; color:var(--ink); text-decoration:none; background:transparent; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
.btn:hover { border-color:var(--ink); }
.btn.pri { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

.hist { margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px; }
.hist li { font-size:12.5px; border:1px solid var(--line); border-radius:999px; padding:2px 10px; color:var(--muted); background:var(--surface); }
.hist-h { font-size:12.5px; color:var(--muted); margin:0 0 6px; }
.note { margin:28px 0 0; font-size:12.5px; color:var(--muted); max-width:46em; }
</style>

<div class="wrap">
  <h1>新竹美食轉盤地圖</h1>
  <p class="lead">不知道吃什麼?按下中間的按鈕,轉盤停在哪一家,右邊的地圖就標出它在新竹的哪一區。</p>
  <div class="chips" id="chips" role="group" aria-label="轉盤範圍"></div>

  <div class="stage">
    <div>

        <button class="hub" id="spin" type="button" aria-label="轉動轉盤">轉!</button>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>

    <div class="panel">

      <section class="res" id="res" aria-live="polite"><p class="empty">還沒轉,先試試手氣。</p></section>
      <div id="histw" hidden><p class="hist-h">剛才轉到</p><ul class="hist" id="hist"></ul></div>

  </div>
  <p class="note">地圖為示意圖,位置依行政區概略標示,非實際比例;出發前請用「在地圖開啟」確認路線。營業時間可能已更動,部分資料引用 2020、2023 年來源,請先致電確認。</p>
